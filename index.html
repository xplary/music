<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpotiFree</title>

    <!-- Conexiones tempranas: ahorran cientos de ms al iniciar -->
    <link rel="preconnect" href="https://www.youtube.com">
    <link rel="preconnect" href="https://i.ytimg.com">
    <link rel="preconnect" href="https://www.googleapis.com">
    <link rel="preconnect" href="https://s.ytimg.com">
    <link rel="dns-prefetch" href="https://googlevideo.com">

    <!-- La API del reproductor se pide ya, en paralelo con el resto de la página -->
    <script>
        window.__ytReady = false;
        window.onYouTubeIframeAPIReady = function () {
            window.__ytReady = true;
            if (window.initPlayer) window.initPlayer();
        };
    </script>
    <script src="https://www.youtube.com/iframe_api" async></script>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #000; color: #fff; font-family: system-ui, -apple-system, sans-serif; user-select: none; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #121212; }
        ::-webkit-scrollbar-thumb { background: #282828; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #3e3e3e; }
        input[type="range"] { accent-color: #1db954; cursor: pointer; }

        #youtube-wrapper {
            position: fixed; right: 12px; bottom: 100px; width: 260px; height: 146px;
            z-index: 30; opacity: 0; pointer-events: none; border-radius: 8px; overflow: hidden;
            transition: opacity .2s; background: #000;
        }
        #youtube-wrapper.show { opacity: 1; pointer-events: auto; box-shadow: 0 4px 20px rgba(0,0,0,.8); }
        #youtube-wrapper iframe { width: 100%; height: 100%; }
        @media (max-width: 767px) { #youtube-wrapper { bottom: 150px; } }
        .playing-card { outline: 2px solid #1db954; }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden">

    <div class="flex flex-1 overflow-hidden">
        <aside class="hidden md:flex flex-col w-64 bg-black p-6 space-y-6">
            <div class="flex items-center space-x-2 text-xl font-bold text-white">
                <i class="fa-brands fa-spotify text-[#1db954] text-3xl"></i>
                <span>SpotiFree</span>
            </div>
            <nav class="space-y-4 text-sm font-semibold text-gray-400">
                <a href="#" onclick="switchTab('home'); return false;" id="nav-home" class="flex items-center space-x-4 text-white hover:text-white transition"><i class="fa-solid fa-house text-lg"></i><span>Inicio</span></a>
                <a href="#" onclick="switchTab('search'); return false;" id="nav-search" class="flex items-center space-x-4 hover:text-white transition"><i class="fa-solid fa-magnifying-glass text-lg"></i><span>Buscar</span></a>
                <a href="#" onclick="switchTab('library'); return false;" id="nav-library" class="flex items-center space-x-4 hover:text-white transition"><i class="fa-solid fa-book text-lg"></i><span>Tus Me Gusta</span></a>
            </nav>
        </aside>

        <main class="flex-1 bg-[#121212] rounded-lg m-2 mb-36 md:mb-24 overflow-y-auto p-4 md:p-8 flex flex-col">
            <div class="flex items-center justify-between mb-6">
                <div class="flex items-center space-x-3 w-full md:w-96 bg-[#242424] rounded-full px-4 py-2 border border-transparent focus-within:border-white transition">
                    <i class="fa-solid fa-magnifying-glass text-gray-400"></i>
                    <input type="text" id="search-input" placeholder="¿Qué quieres reproducir?" class="bg-transparent w-full text-white focus:outline-none text-sm" onkeydown="if(event.key==='Enter') searchMusic()">
                </div>
            </div>
            <div id="view-content" class="flex-1">
                <h2 id="view-title" class="text-2xl font-bold mb-4">Éxitos del Momento</h2>
                <div id="tracks-grid" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-4"></div>
            </div>
        </main>
    </div>

    <footer class="fixed bottom-0 left-0 right-0 h-20 bg-black border-t border-[#282828] px-4 flex items-center justify-between z-50">
        <div class="flex items-center space-x-3 w-1/3">
            <img id="player-thumb" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='56' height='56'><rect width='56' height='56' fill='%23282828'/></svg>" class="w-14 h-14 rounded object-cover bg-[#282828]" alt="">
            <div class="truncate">
                <h4 id="player-title" class="text-sm font-semibold truncate text-white">Selecciona una canción</h4>
                <p id="player-artist" class="text-xs text-gray-400 truncate">SpotiFree</p>
            </div>
            <button onclick="toggleFavoriteCurrent()" class="text-gray-400 hover:text-white ml-2"><i id="player-fav-icon" class="fa-regular fa-heart"></i></button>
        </div>

        <div class="flex flex-col items-center w-1/3 space-y-1">
            <div class="flex items-center space-x-6 text-gray-400">
                <button onclick="prevTrack()" class="hover:text-white"><i class="fa-solid fa-backward-step text-lg"></i></button>
                <button onclick="togglePlay()" id="btn-play" class="w-8 h-8 rounded-full bg-white text-black flex items-center justify-center hover:scale-105 transition"><i class="fa-solid fa-play text-sm ml-0.5"></i></button>
                <button onclick="nextTrack()" class="hover:text-white"><i class="fa-solid fa-forward-step text-lg"></i></button>
                <button onclick="toggleVideo()" title="Mostrar/ocultar video" class="hover:text-white"><i class="fa-solid fa-film text-sm"></i></button>
            </div>
            <div class="flex items-center space-x-2 w-full max-w-md text-xs text-gray-400">
                <span id="current-time">0:00</span>
                <input type="range" id="progress-bar" value="0" min="0" max="100" step="0.1" class="w-full h-1 bg-gray-600 rounded-lg appearance-none cursor-pointer">
                <span id="duration">0:00</span>
            </div>
        </div>

        <div class="hidden md:flex items-center justify-end space-x-3 w-1/3 text-gray-400">
            <i class="fa-solid fa-volume-high text-sm"></i>
            <input type="range" id="volume-bar" value="80" min="0" max="100" class="w-24 h-1 bg-gray-600 rounded-lg appearance-none cursor-pointer" oninput="setVolume(this.value)">
        </div>
    </footer>

    <div class="md:hidden fixed bottom-20 left-0 right-0 bg-black/90 backdrop-blur border-t border-[#282828] flex justify-around py-3 text-xs text-gray-400 z-40">
        <button onclick="switchTab('home')" class="flex flex-col items-center text-white"><i class="fa-solid fa-house text-lg"></i><span>Inicio</span></button>
        <button onclick="switchTab('search')" class="flex flex-col items-center hover:text-white"><i class="fa-solid fa-magnifying-glass text-lg"></i><span>Buscar</span></button>
        <button onclick="switchTab('library')" class="flex flex-col items-center hover:text-white"><i class="fa-solid fa-book text-lg"></i><span>Favoritos</span></button>
    </div>

    <div id="youtube-wrapper"><div id="youtube-player"></div></div>

    <script>
        const YT_API_KEY = 'AIzaSyCZWkUGQDPIrj6mrwQk6v6ravHly2_0jsw';
        const REGION = 'PE';
        const HOME_TTL = 30 * 60 * 1000; // el Inicio se guarda 30 min

        // ---------- Estado ----------
        let player = null, playerReady = false, pendingVideoId = null;
        let viewTracks = [], playQueue = [], playIndex = -1, currentTrack = null;
        let activeTab = 'home', homeCache = null;
        let isPlaying = false, isSeeking = false, progressInterval = null;
        let hasPlayed = false, autoSkips = 0, loadWatchdog = null;
        const searchCache = new Map();
        let favorites = JSON.parse(localStorage.getItem('spotifree_favs_v2') || '[]');

        // ---------- Reproductor: se crea apenas carga la API, sin esperar nada más ----------
        window.initPlayer = function () {
            if (player) return;
            const vars = { playsinline: 1, controls: 1, rel: 0, modestbranding: 1 };
            if (location.protocol.startsWith('http')) vars.origin = location.origin;
            player = new YT.Player('youtube-player', {
                width: '100%', height: '100%', playerVars: vars,
                events: {
                    onReady: () => {
                        playerReady = true;
                        player.setVolume(Number(document.getElementById('volume-bar').value));
                        // Si el usuario ya había elegido una canción mientras cargaba, suena de inmediato
                        if (pendingVideoId) { player.loadVideoById(pendingVideoId); pendingVideoId = null; }
                    },
                    onStateChange: onPlayerStateChange,
                    onError: onPlayerError
                }
            });
        };
        if (window.__ytReady) window.initPlayer();

        function onPlayerStateChange(e) {
            const S = YT.PlayerState;
            if (e.data === S.PLAYING) {
                hasPlayed = true; isPlaying = true;
                clearTimeout(loadWatchdog);
                setPlayIcon('pause'); startProgressTimer();
                setStatus(currentTrack ? currentTrack.artist : '');
            } else if (e.data === S.BUFFERING) {
                setPlayIcon('loading');
            } else if (e.data === S.PAUSED) {
                isPlaying = false; setPlayIcon('play'); stopProgressTimer();
            } else if (e.data === S.ENDED) {
                isPlaying = false; setPlayIcon('play'); stopProgressTimer();
                // Solo cuenta como "terminó" si de verdad sonó y llegó casi al final.
                // Esto ignora los ENDED falsos que YouTube emite al cambiar de video.
                let dur = 0, cur = 0;
                try { dur = player.getDuration(); cur = player.getCurrentTime(); } catch (err) {}
                if (!hasPlayed || dur <= 0 || cur < dur - 3) { console.warn('ENDED falso ignorado'); return; }
                autoAdvance('fin de la lista');
            }
        }

        const ERR_MSG = {
            2: 'parámetro inválido', 5: 'error del reproductor de YouTube',
            100: 'el video no está disponible', 101: 'el dueño bloqueó la reproducción externa',
            150: 'el dueño bloqueó la reproducción externa', 153: 'abre la página por http:// o GitHub Pages'
        };

        function onPlayerError(e) {
            const code = e.data;
            console.warn('Error del reproductor YouTube:', code);
            clearTimeout(loadWatchdog);
            setPlayIcon('play');
            setStatus(`⚠ Error ${code}: ${ERR_MSG[code] || 'desconocido'}`);
            if (code === 100 || code === 101 || code === 150) {
                const failed = currentTrack;
                setTimeout(() => { if (currentTrack === failed) autoAdvance(ERR_MSG[code]); }, 1500);
            }
        }

        // Avance automático con freno de seguridad: máximo 3 seguidos sin que una canción suene de verdad
        function autoAdvance(reason) {
            autoSkips++;
            if (autoSkips > 3 || playQueue.length < 2) {
                setStatus('⚠ Reproducción detenida: ' + reason);
                setPlayIcon('play');
                return;
            }
            nextTrack(true);
        }

        function setStatus(t) { document.getElementById('player-artist').textContent = t; }
        function setPlayIcon(mode) {
            const b = document.getElementById('btn-play');
            b.innerHTML = mode === 'pause' ? '<i class="fa-solid fa-pause text-sm"></i>'
                : mode === 'loading' ? '<i class="fa-solid fa-spinner fa-spin text-sm"></i>'
                : '<i class="fa-solid fa-play text-sm ml-0.5"></i>';
        }

        // ---------- YouTube Data API ----------
        function checkKey() {
            if (!YT_API_KEY || YT_API_KEY.startsWith('PEGA')) { showMessage('Falta configurar tu API Key de YouTube.', true); return false; }
            return true;
        }

        async function ytFetch(path, params) {
            const url = new URL('https://www.googleapis.com/youtube/v3/' + path);
            Object.entries({ ...params, key: YT_API_KEY }).forEach(([k, v]) => url.searchParams.set(k, v));
            const res = await fetch(url);
            const data = await res.json();
            if (!res.ok) throw new Error(data?.error?.message || 'Error ' + res.status);
            return data;
        }

        function decodeHtml(s) { const t = document.createElement('textarea'); t.innerHTML = s; return t.value; }

        function normalize(item) {
            const videoId = typeof item.id === 'string' ? item.id : item.id.videoId;
            const sn = item.snippet, t = sn.thumbnails || {};
            return {
                videoId,
                title: decodeHtml(sn.title),
                artist: decodeHtml(sn.channelTitle || 'YouTube').replace(/ - Topic$/, ''),
                thumb: (t.medium || t.high || t.default || {}).url || '' // miniatura mediana: pesa mucho menos
            };
        }

        async function loadDefaultMusic() {
            if (!checkKey()) return;
            if (homeCache) { viewTracks = homeCache; renderTracks(viewTracks); return; }

            // Carga instantánea desde el almacenamiento local si es reciente
            try {
                const saved = JSON.parse(localStorage.getItem('spotifree_home') || 'null');
                if (saved && Date.now() - saved.t < HOME_TTL && saved.items.length) {
                    homeCache = saved.items; viewTracks = homeCache; renderTracks(viewTracks); return;
                }
            } catch (e) {}

            showMessage('Cargando música...');
            try {
                const data = await ytFetch('videos', {
                    part: 'snippet,status', chart: 'mostPopular', videoCategoryId: '10',
                    regionCode: REGION, maxResults: 50,
                    fields: 'items(id,snippet(title,channelTitle,thumbnails),status/embeddable)' // respuesta más liviana
                });
                homeCache = data.items.filter(i => i.status && i.status.embeddable).map(normalize);
                try { localStorage.setItem('spotifree_home', JSON.stringify({ t: Date.now(), items: homeCache })); } catch (e) {}
                if (activeTab !== 'home') return;
                viewTracks = homeCache; renderTracks(viewTracks);
            } catch (e) { console.error(e); showMessage('Error: ' + e.message, true); }
        }

        async function searchMusic() {
            const query = document.getElementById('search-input').value.trim();
            if (!query) return;
            switchTab('search', true);
            document.getElementById('view-title').textContent = `Resultados para: "${query}"`;
            if (!checkKey()) return;

            const key = query.toLowerCase();
            if (searchCache.has(key)) { viewTracks = searchCache.get(key); renderTracks(viewTracks); return; } // repetida = gratis e instantánea

            showMessage('Buscando canciones...');
            try {
                const data = await ytFetch('search', {
                    part: 'snippet', q: query, type: 'video', videoCategoryId: '10',
                    videoEmbeddable: 'true', videoSyndicated: 'true', maxResults: 25,
                    fields: 'items(id/videoId,snippet(title,channelTitle,thumbnails))'
                });
                if (activeTab !== 'search') return;
                viewTracks = data.items.filter(i => i.id && i.id.videoId).map(normalize);
                searchCache.set(key, viewTracks);
                if (viewTracks.length === 0) showMessage('Sin resultados'); else renderTracks(viewTracks);
            } catch (e) { console.error(e); showMessage('Error: ' + e.message, true); }
        }

        // ---------- UI ----------
        function showMessage(text, isError = false) {
            const grid = document.getElementById('tracks-grid');
            grid.innerHTML = '';
            const div = document.createElement('div');
            div.className = `col-span-full text-center py-10 ${isError ? 'text-red-400' : 'text-gray-400'}`;
            div.textContent = text;
            grid.appendChild(div);
        }

        function renderTracks(tracks) {
            const grid = document.getElementById('tracks-grid');
            if (tracks.length === 0) { showMessage('No hay canciones disponibles'); return; }
            const frag = document.createDocumentFragment(); // un solo repintado
            tracks.forEach((track, index) => {
                const card = document.createElement('div');
                card.dataset.vid = track.videoId;
                card.className = "bg-[#181818] hover:bg-[#282828] p-4 rounded-md transition group cursor-pointer flex flex-col justify-between";
                card.innerHTML = `
                    <div class="relative mb-3">
                        <img class="w-full aspect-square object-cover rounded shadow-md" alt="" loading="lazy" decoding="async">
                        <button class="play-btn absolute bottom-2 right-2 w-10 h-10 bg-[#1db954] text-black rounded-full flex items-center justify-center shadow-lg opacity-0 group-hover:opacity-100 transition transform hover:scale-105">
                            <i class="fa-solid fa-play ml-0.5"></i>
                        </button>
                    </div>
                    <div>
                        <h3 class="font-bold text-sm truncate text-white"></h3>
                        <p class="text-xs text-gray-400 truncate mt-1"></p>
                    </div>`;
                card.querySelector('img').src = track.thumb;
                card.querySelector('h3').textContent = track.title;
                card.querySelector('p').textContent = track.artist;
                const start = (e) => { e.stopPropagation(); playFromView(index); };
                card.querySelector('.play-btn').onclick = start;
                card.onclick = start;
                frag.appendChild(card);
            });
            grid.innerHTML = '';
            grid.appendChild(frag);
            highlightPlaying();
        }

        function highlightPlaying() {
            document.querySelectorAll('#tracks-grid [data-vid]').forEach(el =>
                el.classList.toggle('playing-card', !!currentTrack && el.dataset.vid === currentTrack.videoId));
        }

        // ---------- Reproducción ----------
        function playFromView(index) { playQueue = viewTracks.slice(); autoSkips = 0; playTrack(index); }

        function playTrack(index) {
            const track = playQueue[index];
            if (!track) return;
            playIndex = index; currentTrack = track;
            hasPlayed = false; isPlaying = false;

            // Feedback inmediato: la interfaz responde antes de que YouTube termine de cargar
            document.getElementById('player-title').textContent = track.title;
            setStatus(track.artist);
            document.getElementById('player-thumb').src = track.thumb;
            document.getElementById('progress-bar').value = 0;
            document.getElementById('current-time').textContent = '0:00';
            document.getElementById('duration').textContent = '0:00';
            setPlayIcon('loading');
            updateFavIcon(); highlightPlaying(); updateMediaSession();

            if (playerReady) player.loadVideoById(track.videoId);
            else pendingVideoId = track.videoId; // suena solo cuando el reproductor esté listo

            // Si en 6 s no arrancó (p. ej. el navegador bloqueó el autoplay), avisa en vez de quedarse colgado
            clearTimeout(loadWatchdog);
            loadWatchdog = setTimeout(() => {
                if (!isPlaying && currentTrack === track) {
                    setStatus('Toca ▶ para iniciar la canción');
                    setPlayIcon('play');
                }
            }, 6000);
        }

        function togglePlay() {
            if (!playerReady || !currentTrack) return;
            if (isPlaying) player.pauseVideo(); else player.playVideo();
        }
        function nextTrack(auto) {
            if (auto !== true) autoSkips = 0; // el usuario manda: reinicia el freno
            if (playQueue.length) playTrack((playIndex + 1) % playQueue.length);
        }
        function prevTrack() {
            autoSkips = 0;
            if (!playQueue.length) return;
            if (playerReady && player.getCurrentTime && player.getCurrentTime() > 3) { player.seekTo(0, true); return; }
            playTrack((playIndex - 1 + playQueue.length) % playQueue.length);
        }
        function setVolume(v) { if (playerReady) player.setVolume(Number(v)); }
        function toggleVideo() { document.getElementById('youtube-wrapper').classList.toggle('show'); }

        // Controles del teclado/pantalla de bloqueo del sistema
        function updateMediaSession() {
            if (!('mediaSession' in navigator) || !currentTrack) return;
            navigator.mediaSession.metadata = new MediaMetadata({
                title: currentTrack.title, artist: currentTrack.artist,
                artwork: [{ src: currentTrack.thumb, sizes: '320x180', type: 'image/jpeg' }]
            });
            navigator.mediaSession.setActionHandler('play', togglePlay);
            navigator.mediaSession.setActionHandler('pause', togglePlay);
            navigator.mediaSession.setActionHandler('nexttrack', () => nextTrack());
            navigator.mediaSession.setActionHandler('previoustrack', () => prevTrack());
        }

        // ---------- Barra de progreso ----------
        const bar = document.getElementById('progress-bar');
        bar.addEventListener('input', () => {
            isSeeking = true;
            if (playerReady && player.getDuration)
                document.getElementById('current-time').textContent = formatTime((bar.value / 100) * player.getDuration());
        });
        bar.addEventListener('change', () => {
            if (playerReady && player.getDuration) player.seekTo((bar.value / 100) * player.getDuration(), true);
            isSeeking = false;
        });

        function startProgressTimer() {
            stopProgressTimer();
            progressInterval = setInterval(() => {
                if (!playerReady || isSeeking) return;
                const cur = player.getCurrentTime(), dur = player.getDuration();
                if (dur > 0) {
                    if (cur > 10) autoSkips = 0;
                    bar.value = (cur / dur) * 100;
                    document.getElementById('current-time').textContent = formatTime(cur);
                    document.getElementById('duration').textContent = formatTime(dur);
                }
            }, 500);
        }
        function stopProgressTimer() { if (progressInterval) clearInterval(progressInterval); }
        function formatTime(s) { const m = Math.floor(s / 60), x = Math.floor(s % 60); return `${m}:${x < 10 ? '0' : ''}${x}`; }

        // ---------- Navegación ----------
        function switchTab(tab, skipLoad = false) {
            activeTab = tab;
            ['home', 'search', 'library'].forEach(t => {
                const el = document.getElementById(`nav-${t}`);
                if (el) el.classList.toggle('text-white', t === tab);
            });
            const titleEl = document.getElementById('view-title');
            if (tab === 'home') { titleEl.textContent = "Éxitos del Momento"; loadDefaultMusic(); }
            else if (tab === 'search') {
                titleEl.textContent = "Buscar Canción";
                if (!skipLoad) showMessage('Usa el buscador superior para encontrar música.');
            } else if (tab === 'library') {
                titleEl.textContent = "Tus Me Gusta";
                viewTracks = favorites;
                if (favorites.length === 0) showMessage('Aún no tienes canciones favoritas.'); else renderTracks(favorites);
            }
        }

        // ---------- Favoritos ----------
        function toggleFavoriteCurrent() {
            if (!currentTrack) return;
            const i = favorites.findIndex(f => f.videoId === currentTrack.videoId);
            if (i > -1) favorites.splice(i, 1); else favorites.push(currentTrack);
            localStorage.setItem('spotifree_favs_v2', JSON.stringify(favorites));
            updateFavIcon();
            if (activeTab === 'library') {
                viewTracks = favorites;
                if (favorites.length === 0) showMessage('Aún no tienes canciones favoritas.'); else renderTracks(favorites);
            }
        }
        function updateFavIcon() {
            const isFav = !!currentTrack && favorites.some(f => f.videoId === currentTrack.videoId);
            document.getElementById('player-fav-icon').className = isFav ? "fa-solid fa-heart text-[#1db954]" : "fa-regular fa-heart";
        }

        window.addEventListener('DOMContentLoaded', loadDefaultMusic);
    </script>
</body>
</html>
